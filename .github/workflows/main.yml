name: Build JAR Artifact

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 25 ─────────────────────────────────────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 automatically

      # ── 3. Virtual display for JavaFX (headless CI) ────────────────────────
      - name: Install Xvfb & start virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgtk-3-0 libglib2.0-0
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # ── 4. Compile & run tests ─────────────────────────────────────────────
      - name: Test with Maven
        run: mvn --batch-mode --update-snapshots verify
        env:
          DISPLAY: :99                  # keeps JavaFX tests from crashing

      # ── 5. Upload Surefire test report (always, so failures are visible) ───
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports/
          retention-days: 7

      # ── 6. Upload JAR ──────────────────────────────────────────────────────
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: am17-${{ github.sha }}
          path: target/am17-*.jar
          retention-days: 30

  # ── Optional: release job triggered only on version tags ──────────────────
  release:
    name: Release to GitHub Releases
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write               # needed to create a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install Xvfb & start virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Build release JAR (skip tests — already passed)
        run: mvn --batch-mode -DskipTests package
        env:
          DISPLAY: :99

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/am17-*.jar
          generate_release_notes: true
